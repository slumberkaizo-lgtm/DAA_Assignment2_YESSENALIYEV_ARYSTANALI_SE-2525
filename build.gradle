plugins {
    id 'java'
}

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.11.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

tasks.register('benchmark', JavaExec) {
    group = 'application'
    description = 'Runs W1-W4 and writes results/results.csv.'
    dependsOn classes
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'benchmark.Benchmark'
    javaLauncher = javaToolchains.launcherFor(java.toolchain)
    workingDir = layout.projectDirectory.asFile
}

tasks.register('plotDependencies', Exec) {
    group = 'application'
    description = 'Installs the chart dependencies into the selected Python environment.'
    workingDir = layout.projectDirectory.asFile
    commandLine providers.gradleProperty('pythonExecutable').getOrElse('python'),
            '-m', 'pip', 'install', '-r', 'scripts/requirements-plots.txt'
}

tasks.register('plots', Exec) {
    group = 'application'
    description = 'Generates five PNG charts from the existing results/results.csv.'
    workingDir = layout.projectDirectory.asFile
    commandLine providers.gradleProperty('pythonExecutable').getOrElse('python'),
            'scripts/plot_results.py'
}
